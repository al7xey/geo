name: Step 0 acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: step0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      UV_NO_CACHE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
      - name: Install pinned uv
        run: python -m pip install --no-cache-dir uv==0.9.7
      - name: Install from lock without cache
        run: uv sync --locked
      - name: Verify lock
        run: uv lock --check
      - name: Check dependency compatibility
        run: uv pip check
      - name: Full controlled test suite
        run: uv run --locked pytest -q -ra --junitxml=tmp/pytest.xml
      - name: Real file symlink test
        run: uv run --locked pytest -q -ra tests/test_acceptance.py -k "linked_evidence and symlink" --junitxml=tmp/symlink.xml
      - name: Require real symlink execution without skip
        run: >-
          uv run --locked python -c "import sys, xml.etree.ElementTree as ET;
          suites=ET.parse('tmp/symlink.xml').getroot().findall('.//testsuite');
          tests=sum(int(s.get('tests',0)) for s in suites);
          stopped=sum(int(s.get(k,0)) for s in suites for k in ('skipped','errors','failures'));
          print('Real symlink tests:', tests, 'skipped/failed:', stopped);
          sys.exit(0 if tests==1 and stopped==0 else 1)"
      - name: Strict runtime types for Linux
        run: uv run --locked mypy --platform linux
      - name: Strict runtime types for Windows
        run: uv run --locked mypy --platform win32
      - name: Lint all supported Python code
        run: uv run --locked ruff check src tests tools
      - name: Static security checks
        run: uv run --locked bandit -r src tools
      - name: Generated contracts
        run: uv run --locked python tools/generate_step0_artifacts.py --check
      - name: Export hashed audit constraints
        run: uv export --locked --no-emit-project --format requirements-txt --output-file tmp/audit-requirements.txt --quiet
      - name: Audit dependencies with fresh cache
        run: uv run --locked pip-audit --require-hashes -r tmp/audit-requirements.txt --cache-dir tmp/audit-cache --progress-spinner off
      - name: Build wheel and sdist
        run: uv build --out-dir tmp/package
      - name: Verify package contents
        run: uv run --locked python tools/check_distribution.py tmp/package
      - name: CLI smoke
        run: uv run --locked geo-audit --help
